<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Breads.io</title>
    <style>
        * {
            padding: 0;
            margin: 0;
            box-sizing: border-box;
            text-align: center;
            font-family: 'Trebuchet MS', 'Lucida Sans Unicode', 'Lucida Grande', 'Lucida Sans', Arial, sans-serif;
            font-weight: 600;
        }

        body {
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #eee;
        }

        section {
            background-color: #fff;
            border-radius: 10px;
            border-top: 5px red solid;
            overflow: hidden;
            width: 40%;
            box-shadow: 0 0 5px 0;
        }

        section * {
            padding: 10px;
            margin: 10px 0;
        }

        p {
            background-color: rgb(255, 128, 128);
            margin-bottom: 0;
            padding: 30px;
        }
    </style>
</head>
<body>
    <section>
        <h1>Upgrade Required!</h1>
        <p>Please consider updating your browser to a newer version to be able to use the website.</p>
    </section>
</body>
</html>
